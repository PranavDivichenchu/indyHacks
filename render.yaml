# Render.com Blueprint for Hivemind.
# Push this repo, then "New +" -> "Blueprint" and point it here.
# Set GEMINI_API_KEY in the dashboard (optional) to enable real LLM answers.
services:
  - type: web
    name: hivemind
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
